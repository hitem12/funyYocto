# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-funy"
BBFILE_PATTERN_meta-funy = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-funy = "6"

LAYERDEPENDS_meta-funy = "core"
LAYERSERIES_COMPAT_meta-funy = "whinlatter"
